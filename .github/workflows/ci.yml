name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: Typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

  docker:
    name: Build image and push to GHCR
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the pushed image
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          REF="$(printf '%s\n' "${{ steps.meta.outputs.tags }}" | head -n1)"
          echo "smoke testing $REF"
          docker run -d --name smoke \
            -e SYNOLOGY_URL=https://192.168.1.10:5001 \
            -e SYNOLOGY_USER=ci-smoke \
            -e SYNOLOGY_PASSWORD=ci-smoke \
            -e SYNOLOGY_MCP_TRANSPORT=http \
            -e HOST=0.0.0.0 \
            -e PORT=3000 \
            -p 127.0.0.1:3999:3000 \
            "$REF"
          for i in $(seq 1 30); do
            if curl -fsS -m 2 http://127.0.0.1:3999/healthz; then
              echo
              echo "image $REF is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "::error::/healthz did not come up"
          docker logs smoke
          exit 1

      - name: Clean up smoke container
        if: always() && github.event_name != 'pull_request'
        run: docker rm -f smoke || true
